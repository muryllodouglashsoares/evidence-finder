[package]
name = "evidence-finder"
version = "0.1.0"
description = "Evidence Finder — pesquisa local em evidências (Fase 2: documentos)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "evidence_finder_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
