[package]
name = "evidence-finder"
version = "0.1.0"
description = "Evidence Finder — pesquisa local em evidências (Fase 7: busca semântica local e evidências visuais)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "evidence_finder_lib"

[features]
# Fase 7: motor de embeddings local (Rust puro, sem rede). Ativado por padrão.
# `cargo build --no-default-features` compila o aplicativo sem o motor: a busca
# lexical continua completa e a busca semântica informa que está indisponível.
default = ["semantic-model"]
semantic-model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
# Abre o arquivo no aplicativo padrão do sistema (ShellExecute no Windows), sem
# interpretar o caminho por um shell.
open = "5"
sha2 = "0.10"
encoding_rs = "0.8"
# Leitura de PDF em Rust puro (MIT), sem rayon/chrono/time/jiff.
lopdf = { version = "0.36", default-features = false }
# Fase 5 (exportação): relatório PDF gerado localmente, em Rust puro.
# `flate2` (MIT/Apache-2.0) comprime os fluxos do PDF; já era dependência
# transitiva do `lopdf`. `ttf-parser` (MIT/Apache-2.0, sem dependências) lê
# mapa de caracteres e larguras da fonte embutida (DejaVu, ver assets/fonts).
flate2 = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

# Fase 7 (busca semântica local). Todas rodam no próprio processo, sem rede:
# - candle-* (Apache-2.0/MIT, Hugging Face): inferência de modelos BERT em CPU, Rust puro.
# - tokenizers (Apache-2.0): tokenização do modelo (lê o `tokenizer.json` local).
# Nenhuma dessas crates baixa modelos: os arquivos do modelo são instalados pelo
# usuário (ver docs/FASE7.md) e nunca são obtidos pelo aplicativo.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
# Fase 7 (evidências visuais): decodifica PNG para incorporá-lo ao relatório PDF
# (MIT/Apache-2.0). JPEG é incorporado sem decodificação (DCTDecode).
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
# `unwind` (não `abort`): a extração isola falhas de parsers de PDF com
# catch_unwind para que um documento problemático não derrube o aplicativo.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
